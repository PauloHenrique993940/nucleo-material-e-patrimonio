services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: nucleo
      POSTGRES_USER: nucleo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nucleo_local}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-15432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nucleo']
      interval: 5s
      retries: 10
volumes:
  postgres_data:
